[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readme-forge"
version = "1.0.0"
description = "Generate polished README drafts from local project metadata without network access."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Radwan Abdulhadi Ahmed"}]
dependencies = []
keywords = ["readme", "documentation", "cli", "developer-tools"]

[project.scripts]
readme-forge = "readme_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
